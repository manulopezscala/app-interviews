<h1 class="font-headline-lg text-headline-lg text-on-surface">
                Explica el concepto de closure en JavaScript y proporciona un ejemplo de uso práctico.
            </h1>
<div class="mt-xl flex items-center gap-sm p-md bg-inverse-on-surface border border-primary-container/30" style="border-radius: 0;">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">videocam</span>
<p class="font-body-md text-on-surface-variant">La grabación comenzará automáticamente cuando el tiempo expire.</p>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            let timeLeft = 15;
            const timerElement = document.getElementById('countdown-timer');
            const progressFill = document.getElementById('progress-fill');
            const totalTime = 15;

            const updateTimer = () => {
                const seconds = timeLeft.toString().padStart(2, '0');
                timerElement.textContent = `00:${seconds}`;
                
                const percentage = (timeLeft / totalTime) * 100;
                progressFill.style.width = `${percentage}%`;

                if (timeLeft > 0) {
                    timeLeft--;
                    setTimeout(updateTimer, 1000);
                } else {
                    // Trigger recording start UI change here in real app
                    timerElement.textContent = "00:00";
                    timerElement.classList.remove('text-primary');
                    timerElement.classList.add('text-error');
                    progressFill.classList.remove('bg-primary');
                    progressFill.classList.add('bg-error');
                }
            };

            // Start countdown
            setTimeout(updateTimer, 1000);
        });
    </script>
